app-id: io.nova.launcher
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: nova-launcher
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=~/.local/share/nova-launcher:create  # same data as the native install
modules:
  - name: nova-launcher
    buildsystem: simple
    build-commands:
      # offline: wheels below are pinned by sha256 (requirements.txt + transitive deps; update both together)
      - pip3 install --prefix=/app --no-index --no-deps --find-links=pip-wheels pip-wheels/*.whl
      - install -d /app/share/nova-launcher
      - cp -r *.py nova.css nova-light.css nova-logo.svg referencia.png canal.json icons branding locales /app/share/nova-launcher/
      - |
        cat > /app/bin/nova-launcher <<'SH'
        #!/bin/sh
        exec python3 /app/share/nova-launcher/nova.py "$@"
        SH
      - chmod 755 /app/bin/nova-launcher
      - install -Dm644 LICENSE THIRD_PARTY_LICENSES.md -t /app/share/licenses/io.nova.launcher/
      - install -Dm644 io.nova.launcher.desktop /app/share/applications/io.nova.launcher.desktop
      - install -Dm644 nova-logo.svg /app/share/icons/hicolor/scalable/apps/io.nova.launcher.svg
    sources:
      - type: dir
        path: ../..
      - type: file
        url: https://files.pythonhosted.org/packages/4d/ff/ac903044f43558af87999dda35e7a3c31d278f766e83e484b24d572fdffe/minecraft_launcher_lib-8.0-py3-none-any.whl
        sha256: ff17960c62e21ca7e21329303ae56bdefc0246de3bc9a5e1578dfa8df6604746
        dest: pip-wheels
      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
        dest: pip-wheels
      - type: file
        url: https://files.pythonhosted.org/packages/6d/39/5eec3296860b94ac20bb8ed807725b88f6adfab3f343df592afd975f5f86/certifi-2026.11.20-py3-none-any.whl
